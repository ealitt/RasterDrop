[package]
name = "raster-drop"
version = "0.1.1"
edition = "2024"
authors = ["RasterDrop Contributors"]
description = "A private, local-first desktop image converter"
license = "MIT"
repository = "https://github.com/REPLACE_ME/RasterDrop"
default-run = "raster-drop"

[lib]
name = "rasterdrop"
path = "src/lib.rs"

[[bin]]
name = "raster-drop"
path = "src/main.rs"

[dependencies]
async-channel = "2.5"
directories = "6.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["minimal"] }
dioxus-desktop = { version = "=0.7.9", default-features = false, features = ["tokio_runtime"] }
image = { version = "0.25.10", default-features = false, features = ["avif", "bmp", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6"
libheif-rs = { version = "=2.7.0", default-features = false, features = ["v1_21", "image"] }
num_cpus = "1.17"
open = "5.3"
parking_lot = "0.12"
rfd = "=0.17.2"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.21", features = ["serde", "v4"] }
webp = { version = "=0.3.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3.24"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
panic = "abort"
incremental = false

[package.metadata.bundle]
name = "RasterDrop"
identifier = "com.example.rasterdrop"
publisher = "REPLACE_ME"
icon = ["assets/icon.icns", "assets/icon.ico", "assets/icon.png"]
category = "public.app-category.utilities"
short_description = "Fast local image conversion"
long_description = "Convert images locally using a compact native desktop utility."
