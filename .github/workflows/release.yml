name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
          - os: macos-13
            artifact: macos-x64
          - os: windows-2022
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked
      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install libheif pkg-config
      - name: Configure vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          echo "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static-md
      - name: Quality gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      - name: Bundle macOS
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh
      - name: Bundle Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find target -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -exec cp {} artifacts/ \; || true
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            APP="$(find target -type d -name 'RasterDrop.app' -print -quit)"
            [[ -z "$APP" ]] || ditto -c -k --keepParent "$APP" "artifacts/RasterDrop-${{ matrix.artifact }}.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
