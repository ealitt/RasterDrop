name: Windows executable

on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-executable']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      VCPKGRS_TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Configure native dependencies
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json)."builtin-baseline"
          git -C $env:VCPKG_INSTALLATION_ROOT fetch origin $baseline --depth 1
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch vcpkg baseline" }
          git -C $env:VCPKG_INSTALLATION_ROOT checkout $baseline
          if ($LASTEXITCODE -ne 0) { throw "Failed to select vcpkg baseline" }
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Failed to bootstrap vcpkg" }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Restore native library cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: windows-x64-native-${{ hashFiles('vcpkg.json') }}
      - name: Build native image codecs
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static-md "--x-install-root=$env:VCPKG_ROOT\installed"
          if ($LASTEXITCODE -ne 0) { throw "Native codec build failed" }
      - name: Save native library cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: windows-x64-native-${{ hashFiles('vcpkg.json') }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Build and test Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -ExecutableOnly
      - uses: actions/upload-artifact@v4
        with:
          name: RasterDrop-0.1.1-windows-x64
          path: artifacts/windows-x64/
          if-no-files-found: error
